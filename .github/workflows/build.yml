name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:   # ручной запуск кнопкой во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (с кэшем)
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x pmdMain -x pmdTest --stacktrace

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: Neat-Fabric
          path: |
            Fabric/build/libs/*.jar
            !Fabric/build/libs/*-sources.jar

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: Neat-NeoForge
          path: |
            NeoForge/build/libs/*.jar
            !NeoForge/build/libs/*-sources.jar
